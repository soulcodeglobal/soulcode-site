<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dashboard — Soul Code Global</title>
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<link rel="apple-touch-icon" href="/dashboard/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Soul Code">
<meta name="theme-color" content="#fcfcfc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: light only;
    --bg: #fcfcfc;
    --bg-soft: #f5f5f5;
    --ink: #111111;
    --ink-soft: #444444;
    --ink-faint: #9a9a9a;
    --line: #e4e4e4;
    --red: #b3261e;
    --red-bright: #d4453c;
    --red-soft: #e5776e;
    --mint: #f3d2ce;
    --ok: #2E7D5B;
    --ok-soft: #e2efe9;
    --fserif: "Noto Serif TC", serif;
    --fsans: "Noto Sans TC", sans-serif;
    --fen: "Space Grotesk", var(--fsans);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--fsans);
    font-size: 15.5px;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 56px;
  }
  .shell { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 40;
    background: rgba(252,252,252,.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .hbar {
    max-width: 560px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
  }
  .hbar img { width: 30px; height: 30px; }
  .hbar .ttl { font-family: var(--fserif); font-weight: 900; font-size: 16.5px; letter-spacing: .08em; }
  .hbar .sub { font-family: var(--fen); font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-faint); display: block; margin-top: -3px; }
  .hbar .spacer { flex: 1; }
  .icon-btn {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    font-family: var(--fsans); font-size: 12.5px; color: var(--ink-soft);
    padding: 5px 12px; cursor: pointer;
  }
  .icon-btn:active { background: var(--bg-soft); }

  /* ---------- login ---------- */
  #loginView { display: none; padding-top: 12vh; }
  #loginView .dial { display:block; margin: 0 auto 16px; width: 72px; height: 72px; }
  #loginView h1 { font-family: var(--fserif); font-weight: 900; font-size: 24px; text-align: center; letter-spacing: .1em; }
  #loginView .h-en { text-align:center; color: var(--ink-faint); font-family: var(--fen); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 26px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 22px 20px; box-shadow: 0 14px 34px -18px rgba(0,0,0,.14);
  }
  label { display:block; font-size: 13px; color: var(--ink-soft); font-weight: 500; margin: 14px 0 5px; letter-spacing: .04em; }
  input, select {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 11px;
    color: var(--ink); font-size: 16px; font-family: inherit; padding: 11px 13px;
  }
  input:focus, select:focus { outline: 2px solid var(--red-soft); outline-offset: 1px; border-color: var(--red-soft); }
  .btn-main {
    display:inline-flex; align-items:center; justify-content:center; width:100%;
    margin-top: 20px;
    background: linear-gradient(135deg, var(--red-soft), var(--red-bright));
    color:#fff; border:0; border-radius:999px;
    font-family: inherit; font-size: 15.5px; font-weight:700; letter-spacing:.1em;
    padding: 13px 20px; cursor:pointer;
    box-shadow: 0 8px 22px -8px rgba(212,69,60,.6);
  }
  .btn-main:disabled { opacity:.55; cursor:default; }
  .err { color: var(--red-bright); font-size: 13.5px; margin-top: 12px; display:none; }

  /* ---------- main ---------- */
  #appView { display: none; }
  .banner {
    display:none; background: var(--mint); color: var(--red);
    border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin: 12px 0 0;
  }

  section.blk { margin-top: 16px; }
  .blk-head {
    width: 100%; display:flex; align-items:center; gap: 8px;
    background:none; border:0; cursor:pointer; text-align:left;
    padding: 8px 2px; font-family: inherit;
  }
  .blk-head h2 { font-family: var(--fserif); font-weight: 900; font-size: 18.5px; letter-spacing: .08em; }
  .blk-head h2 .cn { font-family: var(--fsans); font-weight: 400; font-size: 12px; color: var(--ink-faint); margin-left: 5px; letter-spacing: .04em; }
  .blk-head .cnt {
    font-family: var(--fen); font-size: 12.5px; font-weight: 700;
    background: var(--ink); color:#fff; border-radius: 999px;
    min-width: 22px; height: 22px; display:inline-flex; align-items:center; justify-content:center; padding: 0 7px;
  }
  .blk-head .cnt.hot { background: var(--red-bright); }
  .blk-head .chev { margin-left:auto; color: var(--ink-faint); font-size: 13px; transition: transform .15s; }
  .blk.open .blk-head .chev { transform: rotate(90deg); }
  .blk-body { display:none; }
  .blk.open .blk-body { display:block; }

  .row {
    background:#fff; border:1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px;
    display:flex; align-items:flex-start; gap: 11px;
  }
  .row .grow { flex:1; min-width:0; }
  .row .t1 { font-weight: 500; font-size: 15px; }
  .row .t2 { color: var(--ink-soft); font-size: 13px; margin-top: 1px; }
  .row .time { font-family: var(--fen); font-size: 13.5px; color: var(--ink); }
  .row .time .alt { color: var(--ink-faint); font-size: 12px; }
  .row.dim { opacity: .5; }

  .tag {
    display:inline-block; font-size: 11.5px; border-radius: 999px; padding: 1.5px 9px;
    font-weight: 500; vertical-align: 1px;
  }
  .tag.red { background: var(--mint); color: var(--red); }
  .tag.grey { background: var(--bg-soft); color: var(--ink-soft); }
  .tag.green { background: var(--ok-soft); color: var(--ok); }

  .chk {
    width: 25px; height: 25px; min-width: 25px; margin-top: 1px;
    border: 1.6px solid var(--line); border-radius: 8px; background:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size: 15px; color: transparent;
  }
  .chk.on { background: var(--ok); border-color: var(--ok); color:#fff; }

  .star {
    background:none; border:0; cursor:pointer; font-size: 19px; line-height:1;
    color: #d8d8d8; padding: 2px 4px; margin-top: -1px;
  }
  .star.on { color: var(--red-bright); }

  .sub-h {
    font-family: var(--fen); font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-faint); margin: 16px 2px 8px;
  }
  .empty { color: var(--ink-faint); font-size: 13.5px; padding: 8px 2px 4px; }

  .searchbox { margin-bottom: 10px; }

  /* group card */
  .gcard { background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:8px; overflow:hidden; }
  .gcard > button {
    width:100%; display:flex; align-items:center; gap:10px; padding: 12px 14px;
    background:none; border:0; font-family:inherit; font-size:15px; cursor:pointer; text-align:left;
  }
  .gcard .gname { font-weight: 700; }
  .gcard .gmeta { color: var(--ink-soft); font-size: 13px; }
  .gcard .chev { margin-left:auto; color: var(--ink-faint); font-size:13px; }
  .gcard .members { border-top: 1px solid var(--line); padding: 6px 14px 10px; display:none; }
  .gcard.open .members { display:block; }
  .member { display:flex; align-items:center; gap:10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .member:last-child { border-bottom: 0; }
  .member .nm { flex:1; font-size: 14.5px; }
  .member.done .nm { color: var(--ink-faint); }

  /* fab + modal */
  .add-btn {
    width:100%; margin-top: 4px;
    border: 1.5px dashed var(--red-soft); background: none; color: var(--red);
    border-radius: 14px; padding: 12px; font-family: inherit; font-size: 14.5px; font-weight: 700;
    letter-spacing: .06em; cursor: pointer;
  }
  #modalWrap {
    display:none; position: fixed; inset: 0; z-index: 60;
    background: rgba(17,17,17,.45); align-items: flex-end; justify-content: center;
  }
  #modalWrap.on { display:flex; }
  .modal {
    background: var(--bg); width: 100%; max-width: 560px;
    border-radius: 20px 20px 0 0; padding: 20px 18px 30px;
    max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { font-family: var(--fserif); font-weight: 900; font-size: 18px; letter-spacing:.08em; margin-bottom: 2px; }
  .modal .close { float: right; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 14px;
    border-radius: 999px; padding: 9px 20px; z-index: 80;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .toast.on { opacity: 1; }

  @media (prefers-reduced-motion: no-preference) {
    .card, .row, .gcard { animation: rise .3s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="shell">
  <img class="dial" src="/assets/soulcode-icon.svg" alt="Soul Code">
  <h1>Client Manager</h1>
  <div class="h-en">Soul Code Global</div>
  <div class="card">
    <label for="lEmail">Email</label>
    <input type="email" id="lEmail" autocomplete="username" inputmode="email">
    <label for="lPass">Password <span style="color:var(--ink-faint);font-weight:400;">密碼</span></label>
    <input type="password" id="lPass" autocomplete="current-password">
    <p class="err" id="lErr"></p>
    <button class="btn-main" id="lBtn">Sign in</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView">
  <header>
    <div class="hbar">
      <img src="/assets/soulcode-icon.svg" alt="">
      <div>
        <span class="ttl">Client Manager</span>
        <span class="sub">Soul Code Global</span>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="refreshBtn">↻ Refresh</button>
      <button class="icon-btn" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <div class="shell">
    <div class="banner" id="banner"></div>

    <!-- 待辦 -->
    <section class="blk open" id="blkTodo">
      <button class="blk-head" data-blk="blkTodo">
        <h2>To-dos <span class="cn">待辦</span></h2><span class="cnt" id="todoCnt">0</span><span class="chev">▶</span>
      </button>
      <div class="blk-body" id="todoBody"></div>
    </section>

    <!-- 行程 -->
    <section class="blk" id="blkSched">
      <button class="blk-head" data-blk="blkSched">
        <h2>Schedule <span class="cn">行程</span></h2><span class="cnt" id="schedCnt">0</span><span class="chev">▶</span>
      </button>
      <div class="blk-body" id="schedBody"></div>
    </section>

    <!-- 未交付服務 -->
    <section class="blk" id="blkServe">
      <button class="blk-head" data-blk="blkServe">
        <h2>To Deliver <span class="cn">未交付服務</span></h2><span class="cnt" id="serveCnt">0</span><span class="chev">▶</span>
      </button>
      <div class="blk-body">
        <div class="searchbox"><input type="search" id="serveSearch" placeholder="Search clients… 搜尋客名"></div>
        <div id="serveBody"></div>
        <div class="sub-h">Group classes 課堂</div>
        <div id="groupBody"></div>
        <div class="sub-h">Credits</div>
        <div id="creditBody"></div>
        <div class="sub-h">Deposits 留位費</div>
        <div id="depositBody"></div>
        <button class="add-btn" id="addBtn">＋ Add purchase 加購買紀錄</button>
      </div>
    </section>
  </div>
</div>

<!-- ============ 加購買 modal ============ -->
<div id="modalWrap">
  <div class="modal">
    <button class="icon-btn close" id="mClose">Close</button>
    <h3>Add purchase <span style="font-family:var(--fsans);font-weight:400;font-size:12px;color:var(--ink-faint);">加購買紀錄</span></h3>
    <p style="color:var(--ink-soft);font-size:13px;">Manual entry — bank transfer or online card. 手動入帳</p>

    <label for="mEmail">Client email</label>
    <input type="email" id="mEmail" list="clientList" placeholder="Type or pick an existing client" inputmode="email">
    <datalist id="clientList"></datalist>

    <label for="mPkg">Product 產品</label>
    <select id="mPkg"></select>

    <label for="mPay">Payment method 收款方式</label>
    <select id="mPay">
      <option value="轉帳">Bank transfer 轉帳</option>
      <option value="線上信用卡付款">Online card 線上信用卡付款</option>
    </select>

    <label for="mDate">Purchase date (blank = today)</label>
    <input type="date" id="mDate">

    <div id="mNewFields" style="display:none">
      <p style="color:var(--red);font-size:13px;margin-top:14px;">New client — please add their name. 新客戶，請補姓名</p>
      <label for="mName">Name 姓名</label>
      <input type="text" id="mName">
      <label for="mNick">Preferred name (optional)</label>
      <input type="text" id="mNick">
      <label for="mPhone">Phone (optional)</label>
      <input type="tel" id="mPhone" inputmode="tel">
    </div>

    <p class="err" id="mErr"></p>
    <button class="btn-main" id="mSubmit">Add 入帳</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var SUPABASE_URL = "https://vloxjzyxanhrbwolfgwz.supabase.co";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsb3hqenl4YW5ocmJ3b2xmZ3d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjA1MjYsImV4cCI6MjEwMjMzNjUyNn0.gs35_rveeZRSNPeyIk4HfMxk8Mo8ddn7LDv2Gl09SYs";
  var ENROLL_URL = SUPABASE_URL + "/functions/v1/enroll";

  var sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);
  var $ = function (id) { return document.getElementById(id); };
  var D = { clients: [], ents: [], credits: [], deposits: [], sessions: [], todos: [], catalog: [] };

  /* ---------- 時間工具:雙時區 ---------- */
  function fmtIn(tz, d, opts) {
    return new Intl.DateTimeFormat("en-GB", Object.assign({ timeZone: tz }, opts)).format(d);
  }
  function hkDateKey(d) {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Hong_Kong", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  }
  function sydAbbr(d) {
    try {
      var parts = new Intl.DateTimeFormat("en-AU", { timeZone: "Australia/Sydney", timeZoneName: "short" }).formatToParts(d);
      var tn = parts.find(function (p) { return p.type === "timeZoneName"; });
      if (tn && /^A/.test(tn.value)) return tn.value;
    } catch (e) {}
    return "SYD";
  }
  function dualTime(iso) {
    var d = new Date(iso);
    var hk = fmtIn("Asia/Hong_Kong", d, { hour: "2-digit", minute: "2-digit", hour12: false });
    var sy = fmtIn("Australia/Sydney", d, { hour: "2-digit", minute: "2-digit", hour12: false });
    return hk + ' HKT <span class="alt">· ' + sy + " " + sydAbbr(d) + "</span>";
  }
  function hkDateLabel(iso) {
    var d = new Date(iso);
    return new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Hong_Kong", weekday: "short", day: "numeric", month: "short" }).format(d);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function cname(c) { return c ? (c.nickname ? c.nickname + "（" + c.name + "）" : c.name) : "—"; }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("on");
    setTimeout(function () { t.classList.remove("on"); }, 2200);
  }
  function banner(msg) {
    var b = $("banner");
    if (!msg) { b.style.display = "none"; return; }
    b.textContent = msg; b.style.display = "block";
  }

  /* ---------- auth ---------- */
  function showLogin() { $("loginView").style.display = "block"; $("appView").style.display = "none"; }
  function showApp() { $("loginView").style.display = "none"; $("appView").style.display = "block"; }

  $("lBtn").addEventListener("click", doLogin);
  $("lPass").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  function doLogin() {
    var btn = $("lBtn"); btn.disabled = true; $("lErr").style.display = "none";
    sb.auth.signInWithPassword({ email: $("lEmail").value.trim(), password: $("lPass").value })
      .then(function (r) {
        btn.disabled = false;
        if (r.error) {
          $("lErr").textContent = "Sign-in failed — check your email and password.";
          $("lErr").style.display = "block";
          return;
        }
        showApp(); loadAll();
      });
  }
  $("logoutBtn").addEventListener("click", function () {
    sb.auth.signOut().then(function () { location.reload(); });
  });
  $("refreshBtn").addEventListener("click", loadAll);

  /* ---------- 摺疊 ---------- */
  document.querySelectorAll(".blk-head").forEach(function (h) {
    h.addEventListener("click", function () { $(h.dataset.blk).classList.toggle("open"); });
  });

  /* ---------- 載入 ---------- */
  function loadAll() {
    banner("");
    var now = new Date();
    var lo = new Date(now.getTime() - 12 * 3600e3).toISOString();
    var hi = new Date(now.getTime() + 45 * 86400e3).toISOString();
    Promise.all([
      sb.from("clients").select("id,name,nickname,email").order("name"),
      sb.from("entitlements").select("*, clients(name,nickname)").order("created_at"),
      sb.from("v_client_credit_total").select("*"),
      sb.from("deposits").select("*, clients(name,nickname)").gt("remaining", 0),
      sb.from("sessions").select("*, clients(name,nickname)").neq("status", "cancelled").gte("starts_at", lo).lte("starts_at", hi).order("starts_at"),
      sb.from("todos").select("*, clients(name,nickname)").neq("status", "done").order("due_at", { ascending: true, nullsFirst: false }),
      sb.from("package_catalog").select("*").eq("active", true).order("code")
    ]).then(function (rs) {
      var names = ["clients", "entitlements", "v_client_credit_total", "deposits", "sessions", "todos", "package_catalog"];
      for (var i = 0; i < rs.length; i++) {
        if (rs[i].error) { banner("Error reading " + names[i] + ": " + rs[i].error.message); return; }
      }
      D.clients = rs[0].data; D.ents = rs[1].data; D.credits = rs[2].data;
      D.deposits = rs[3].data; D.sessions = rs[4].data; D.todos = rs[5].data; D.catalog = rs[6].data;
      renderAll();
    });
  }

  function renderAll() { renderTodos(); renderSched(); renderServe(); renderModalOpts(); }

  /* ---------- 待辦 ---------- */
  function renderTodos() {
    var now = new Date();
    var html = "";
    D.todos.forEach(function (t) {
      var overdue = t.due_at && new Date(t.due_at) < now;
      var due = t.due_at
        ? hkDateLabel(t.due_at) + (overdue ? ' <span class="tag red">Overdue</span>' : "")
        : '<span class="tag grey">No due date</span>';
      html += '<div class="row">' +
        '<button class="chk" data-todo="' + t.id + '">✓</button>' +
        '<div class="grow"><div class="t1">' + esc(t.title) + "</div>" +
        '<div class="t2">' + (t.clients ? esc(cname(t.clients)) + " · " : "") + due + "</div></div></div>";
    });
    $("todoBody").innerHTML = html || '<p class="empty">All clear ✓</p>';
    $("todoCnt").textContent = D.todos.length;
    $("todoCnt").className = "cnt" + (D.todos.some(function (t) { return t.due_at && new Date(t.due_at) < now; }) ? " hot" : "");
    $("todoBody").querySelectorAll("[data-todo]").forEach(function (b) {
      b.addEventListener("click", function () {
        b.classList.add("on");
        sb.from("todos").update({ status: "done", completed_at: new Date().toISOString() }).eq("id", b.dataset.todo)
          .then(function (r) {
            if (r.error) { banner("Update failed: " + r.error.message); b.classList.remove("on"); return; }
            toast("Done"); loadAll();
          });
      });
    });
  }

  /* ---------- 行程 ---------- */
  function renderSched() {
    var now = new Date();
    var todayKey = hkDateKey(now);
    var next3 = [];
    for (var i = 1; i <= 3; i++) next3.push(hkDateKey(new Date(now.getTime() + i * 86400e3)));
    var monthKey = todayKey.slice(0, 7);

    var buckets = { today: [], soon: [], month: [] };
    D.sessions.forEach(function (s) {
      if (!s.starts_at) return;
      var k = hkDateKey(new Date(s.starts_at));
      if (k === todayKey) buckets.today.push(s);
      else if (next3.indexOf(k) >= 0) buckets.soon.push(s);
      else if (k.slice(0, 7) === monthKey && k > todayKey) buckets.month.push(s);
    });

    function rows(list) {
      if (!list.length) return '<p class="empty">Nothing scheduled</p>';
      return list.map(function (s) {
        return '<div class="row"><div class="grow">' +
          '<div class="time">' + hkDateLabel(s.starts_at) + " · " + dualTime(s.starts_at) + "</div>" +
          '<div class="t1">' + esc(s.title || "Session") + "</div>" +
          '<div class="t2">' + esc(cname(s.clients)) + "</div>" +
          "</div></div>";
      }).join("");
    }
    $("schedBody").innerHTML =
      '<div class="sub-h">Today 今日</div>' + rows(buckets.today) +
      '<div class="sub-h">Next 3 days</div>' + rows(buckets.soon) +
      '<div class="sub-h">Later this month</div>' + rows(buckets.month);
    $("schedCnt").textContent = buckets.today.length + buckets.soon.length + buckets.month.length;
  }

  /* ---------- 未交付服務 ---------- */
  function daysTo(dateStr) {
    return Math.ceil((new Date(dateStr + "T23:59:59+08:00") - new Date()) / 86400e3);
  }
  function renderServe() {
    var q = $("serveSearch").value.trim().toLowerCase();
    function hit(c) {
      if (!q) return true;
      return (c && ((c.name || "").toLowerCase().indexOf(q) >= 0 || (c.nickname || "").toLowerCase().indexOf(q) >= 0));
    }

    /* 1v1 */
    var solo = D.ents.filter(function (e) { return !e.is_group && hit(e.clients); });
    var open = solo.filter(function (e) { return e.done_slots < e.total_slots; });
    var done = solo.filter(function (e) { return e.done_slots >= e.total_slots; });
    open.sort(function (a, b) {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      if (!!a.expires_at !== !!b.expires_at) return a.expires_at ? -1 : 1;
      if (a.expires_at !== b.expires_at) return a.expires_at < b.expires_at ? -1 : 1;
      return 0;
    });

    function soloRow(e, isDone) {
      var exp = "";
      if (e.expires_at) {
        var dd = daysTo(e.expires_at);
        exp = ' <span class="tag ' + (dd <= 14 ? "red" : "grey") + '">' +
          (dd < 0 ? "Expired" : "Due " + e.expires_at.slice(5).replace("-", "/")) + "</span>";
      }
      return '<div class="row' + (isDone ? " dim" : "") + '">' +
        '<button class="chk' + (isDone ? " on" : "") + '" data-ent="' + e.id + '" data-total="' + e.total_slots + '" data-done="' + e.done_slots + '">✓</button>' +
        '<div class="grow"><div class="t1">' + esc(cname(e.clients)) + "</div>" +
        '<div class="t2">' + esc(e.item) + exp + "</div></div>" +
        '<button class="star' + (e.pinned ? " on" : "") + '" data-pin="' + e.id + '" data-pinned="' + e.pinned + '">★</button>' +
        "</div>";
    }
    var html = open.map(function (e) { return soloRow(e, false); }).join("");
    if (done.length) {
      html += '<div class="sub-h">Completed 已完成</div>' + done.map(function (e) { return soloRow(e, true); }).join("");
    }
    $("serveBody").innerHTML = html || '<p class="empty">No open 1-on-1 items</p>';
    $("serveCnt").textContent = open.length;

    /* 群組卡 */
    var groups = {};
    D.ents.filter(function (e) { return e.is_group; }).forEach(function (e) {
      (groups[e.item] = groups[e.item] || []).push(e);
    });
    var ghtml = "";
    Object.keys(groups).forEach(function (item) {
      var list = groups[item];
      var doneN = list.filter(function (e) { return e.done_slots >= e.total_slots; }).length;
      var exp = list.map(function (e) { return e.expires_at; }).filter(Boolean).sort()[0];
      var meta = list.length + " people" +
        (doneN ? " · attended " + doneN : "") +
        (exp ? " · until " + exp.slice(5).replace("-", "/") : "");
      var members = list.slice().sort(function (a, b) {
        return cname(a.clients) < cname(b.clients) ? -1 : 1;
      }).map(function (e) {
        var d = e.done_slots >= e.total_slots;
        return '<div class="member' + (d ? " done" : "") + '">' +
          '<button class="chk' + (d ? " on" : "") + '" data-ent="' + e.id + '" data-total="' + e.total_slots + '" data-done="' + e.done_slots + '">✓</button>' +
          '<span class="nm">' + esc(cname(e.clients)) + "</span></div>";
      }).join("");
      ghtml += '<div class="gcard"><button data-g>' +
        '<span class="gname">' + esc(item) + '</span><span class="gmeta">' + meta + '</span><span class="chev">▶</span>' +
        '</button><div class="members">' + members + "</div></div>";
    });
    $("groupBody").innerHTML = ghtml || '<p class="empty">No group classes</p>';
    $("groupBody").querySelectorAll("[data-g]").forEach(function (b) {
      b.addEventListener("click", function () { b.parentElement.classList.toggle("open"); });
    });

    /* Credit */
    var creds = D.credits.filter(function (c) { return Number(c.remaining) !== 0; });
    $("creditBody").innerHTML = creds.length
      ? creds.map(function (c) {
          return '<div class="row"><div class="grow"><div class="t1">' + esc(c.nickname || c.name) + "</div></div>" +
            '<span class="tag ' + (c.remaining > 0 ? "green" : "red") + '">bal ' + c.remaining + "</span></div>";
        }).join("")
      : '<p class="empty">No credits held</p>';

    /* Deposits */
    $("depositBody").innerHTML = D.deposits.length
      ? D.deposits.map(function (d) {
          return '<div class="row"><div class="grow"><div class="t1">' + esc(cname(d.clients)) + "</div>" +
            '<div class="t2">' + esc(d.purpose || "留位費") + "</div></div>" +
            '<span class="tag green">' + esc(d.currency) + " " + Number(d.remaining) + "</span></div>";
        }).join("")
      : '<p class="empty">No deposits</p>';

    /* 綁 tick / 星 */
    document.querySelectorAll("#serveBody [data-ent], #groupBody [data-ent]").forEach(function (b) {
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var isDone = Number(b.dataset.done) >= Number(b.dataset.total);
        var newDone = isDone ? 0 : Number(b.dataset.total);
        sb.from("entitlements").update({ done_slots: newDone }).eq("id", b.dataset.ent)
          .then(function (r) {
            if (r.error) { banner("Update failed: " + r.error.message); return; }
            toast(newDone ? "Ticked ✓" : "Reverted"); loadAll();
          });
      });
    });
    document.querySelectorAll("#serveBody [data-pin]").forEach(function (b) {
      b.addEventListener("click", function () {
        var to = b.dataset.pinned !== "true";
        sb.from("entitlements").update({ pinned: to }).eq("id", b.dataset.pin)
          .then(function (r) {
            if (r.error) { banner("Update failed: " + r.error.message); return; }
            loadAll();
          });
      });
    });
  }
  $("serveSearch").addEventListener("input", renderServe);

  /* ---------- 加購買 modal ---------- */
  function renderModalOpts() {
    $("clientList").innerHTML = D.clients
      .filter(function (c) { return c.email; })
      .map(function (c) { return '<option value="' + esc(c.email) + '">' + esc(cname(c)) + "</option>"; }).join("");
    $("mPkg").innerHTML = D.catalog
      .map(function (p) {
        return '<option value="' + esc(p.code) + '">' + esc(p.name) + " · " + esc(p.currency) + " " + Number(p.price) + "</option>";
      }).join("");
  }
  $("addBtn").addEventListener("click", function () {
    $("mErr").style.display = "none"; $("mNewFields").style.display = "none";
    $("mEmail").value = ""; $("mDate").value = ""; $("mName").value = ""; $("mNick").value = ""; $("mPhone").value = "";
    $("modalWrap").classList.add("on");
  });
  $("mClose").addEventListener("click", function () { $("modalWrap").classList.remove("on"); });

  $("mSubmit").addEventListener("click", function () {
    var btn = $("mSubmit"); var err = $("mErr"); err.style.display = "none";
    var email = $("mEmail").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      err.textContent = "Please enter a valid email."; err.style.display = "block"; return;
    }
    btn.disabled = true; btn.textContent = "Working…";
    sb.auth.getSession().then(function (s) {
      var token = s.data.session ? s.data.session.access_token : "";
      return fetch(ENROLL_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({
          package_code: $("mPkg").value,
          email: email,
          name: $("mName").value.trim(),
          nickname: $("mNick").value.trim(),
          phone: $("mPhone").value.trim(),
          payment_method: $("mPay").value,
          purchased_at: $("mDate").value || null,
          admin: true
        })
      });
    }).then(function (r) { return r.json(); }).then(function (res) {
      btn.disabled = false; btn.textContent = "Add 入帳";
      if (res.ok && res.need_details) {
        $("mNewFields").style.display = "block";
        err.textContent = "No record found for this email — if it's a new client, add their name and submit again.";
        err.style.display = "block"; return;
      }
      if (res.ok) {
        $("modalWrap").classList.remove("on");
        toast("Added: " + (res.package || "")); loadAll(); return;
      }
      err.textContent = "Failed: " + (res.error || "unknown"); err.style.display = "block";
    }).catch(function () {
      btn.disabled = false; btn.textContent = "Add 入帳";
      err.textContent = "Network error — please try again."; err.style.display = "block";
    });
  });

  /* ---------- 開機 ---------- */
  sb.auth.getSession().then(function (s) {
    if (s.data.session) { showApp(); loadAll(); } else { showLogin(); }
  });
})();
</script>
</body>
</html>
