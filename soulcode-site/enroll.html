<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>報名登記 — Soul Code Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light only;
    --bg: #fcfcfc;
    --bg-soft: #f5f5f5;
    --ink: #111111;
    --ink-soft: #444444;
    --line: #e4e4e4;
    --red: #b3261e;
    --red-bright: #d4453c;
    --red-soft: #e5776e;
    --mint: #f3d2ce;
    --ok: #2E7D5B;
    --fserif: "Noto Serif TC", serif;
    --fsans: "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--fsans);
    font-size: 16px;
    line-height: 1.75;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 44px 20px 64px;
  }
  .wrap { width: 100%; max-width: 460px; }

  .dial { display: block; margin: 0 auto 18px; width: 84px; height: 84px; }

  h1 {
    font-family: var(--fserif);
    font-weight: 900;
    font-size: 27px;
    text-align: center;
    letter-spacing: .1em;
  }
  .brand {
    text-align: center;
    color: var(--ink-soft);
    font-family: "Space Grotesk", var(--fsans);
    font-size: 12px;
    letter-spacing: .3em;
    text-transform: uppercase;
    margin: 4px 0 30px;
  }

  .card {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px 30px;
    box-shadow: 0 14px 34px -18px rgba(0,0,0,.14);
  }
  .product {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px; margin-bottom: 20px;
  }
  .product .p-label { color: var(--ink-soft); font-size: 13px; letter-spacing: .12em; }
  .product .p-name {
    font-family: var(--fserif);
    font-weight: 700;
    font-size: 20px;
    color: var(--red);
    letter-spacing: .06em;
  }
  .lede { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 20px; }

  label { display: block; font-size: 13.5px; color: var(--ink-soft); font-weight: 500; margin: 16px 0 6px; letter-spacing: .04em; }
  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-size: 16px;
    font-family: inherit;
    padding: 12px 14px;
  }
  input:focus, select:focus { outline: 2px solid var(--red-soft); outline-offset: 1px; border-color: var(--red-soft); }
  input::placeholder { color: #B7B7B7; }

  .hint { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .notice {
    display: none;
    background: var(--mint);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    margin-top: 18px;
    color: var(--red);
  }
  .error { color: var(--red-bright); font-size: 14px; margin-top: 14px; display: none; }

  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-top: 26px;
    background: linear-gradient(135deg, var(--red-soft), var(--red-bright));
    color: #ffffff;
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: .14em;
    padding: 14px 22px;
    cursor: pointer;
    box-shadow: 0 8px 22px -8px rgba(212,69,60,.6);
    transition: transform .15s, box-shadow .2s;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .55; cursor: default; transform: none; }

  .done { display: none; text-align: center; padding: 8px 0 4px; }
  .done .tick {
    width: 54px; height: 54px; margin: 4px auto 18px;
    border: 1.5px solid var(--ok); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--ok); font-size: 26px;
  }
  .done h2 { font-family: var(--fserif); font-size: 21px; font-weight: 700; letter-spacing: .1em; margin-bottom: 10px; }
  .done p { color: var(--ink-soft); font-size: 14.5px; }

  .foot { text-align: center; color: #9a9a9a; font-size: 12px; margin-top: 26px; letter-spacing: .05em; }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise .45s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div class="wrap">

  <img class="dial" src="/assets/soulcode-icon.svg" alt="Soul Code">

  <h1>報名登記</h1>
  <div class="brand">Soul Code Global</div>

  <div class="card">
    <div class="product">
      <span class="p-label">課程</span>
      <span class="p-name" id="productName">—</span>
    </div>

    <form id="form" novalidate>
      <p class="lede" id="lede"></p>

      <div id="adminFields" style="display:none">
        <label for="pkg">課程項目</label>
        <select id="pkg">
          <option value="l2">L2課堂</option>
          <option value="l1">L1課堂</option>
        </select>
        <label for="pay">收款方式</label>
        <select id="pay">
          <option value="現場已收">現場已收</option>
          <option value="已轉帳">已轉帳</option>
          <option value="stripe">Stripe 付款連結</option>
        </select>
      </div>

      <label for="email">Email</label>
      <input type="email" id="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
      <p class="hint" id="emailHint" style="display:none">請使用之前報名時的 Email。</p>

      <div id="detailFields" style="display:none">
        <label for="name">姓名</label>
        <input type="text" id="name" autocomplete="name" placeholder="與付款時相同的姓名">
        <label for="nickname">稱呼(選填)</label>
        <input type="text" id="nickname" placeholder="希望我們怎麼稱呼你">
        <label for="phone">電話</label>
        <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="+852 / +61 開頭皆可">
      </div>

      <div class="notice" id="notice"></div>
      <p class="error" id="error"></p>

      <button type="submit" id="submitBtn">完成登記</button>
    </form>

    <div class="done" id="done">
      <div class="tick">✓</div>
      <h2 id="doneTitle">登記完成</h2>
      <p id="doneMsg">我們已收到你的資料,Fiona 會盡快與你聯繫,確認上課安排。</p>
    </div>
  </div>

  <p class="foot">如有疑問,請直接聯繫 Soul Code Global。</p>
</div>

<script>
(function () {
  var ENDPOINT = "https://vloxjzyxanhrbwolfgwz.supabase.co/functions/v1/enroll";

  var qs = new URLSearchParams(location.search);
  var isAdmin = qs.get("admin") === "1";
  var pkgCode = (qs.get("p") || "").toLowerCase();
  var NAMES = { l1: "L1課堂", l2: "L2課堂" };

  var $ = function (id) { return document.getElementById(id); };
  var detailsOpen = false;

  function setProduct(code) {
    pkgCode = code;
    $("productName").textContent = NAMES[code] || "—";
    if (code === "l1" && !detailsOpen) toggleDetails(true);
  }
  function toggleDetails(on) {
    detailsOpen = on;
    $("detailFields").style.display = on ? "block" : "none";
  }

  if (isAdmin) {
    $("adminFields").style.display = "block";
    $("lede").textContent = "代同學登記:選擇課程與收款方式,填寫同學資料。";
    toggleDetails(true);
    setProduct(pkgCode || "l2");
    $("pkg").value = pkgCode || "l2";
    $("pkg").addEventListener("change", function () { setProduct(this.value); });
  } else {
    if (!NAMES[pkgCode]) pkgCode = "l2";
    setProduct(pkgCode);
    if (pkgCode === "l2") {
      $("lede").textContent = "感謝你完成付款。L2 的同學都是舊生,填寫報名時使用的 Email 即可完成登記。";
      $("emailHint").style.display = "block";
    } else {
      $("lede").textContent = "感謝你完成付款。請留下你的資料,完成報名登記。";
    }
  }

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var email = $("email").value.trim();
    var err = $("error");
    err.style.display = "none";
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      err.textContent = "請輸入正確的 Email。";
      err.style.display = "block";
      return;
    }
    if (detailsOpen && !isAdmin && pkgCode === "l1" && !$("name").value.trim()) {
      err.textContent = "請填寫姓名。";
      err.style.display = "block";
      return;
    }

    var btn = $("submitBtn");
    btn.disabled = true;
    btn.textContent = "處理中⋯";

    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        package_code: isAdmin ? $("pkg").value : pkgCode,
        email: email,
        name: $("name").value.trim(),
        nickname: $("nickname").value.trim(),
        phone: $("phone").value.trim(),
        payment_method: isAdmin ? $("pay").value : "stripe",
        admin: isAdmin
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      btn.disabled = false;
      btn.textContent = "完成登記";
      if (res.ok && res.need_details) {
        toggleDetails(true);
        var n = $("notice");
        n.textContent = "找不到這個 Email 的紀錄。可以改用之前的 Email,或補上以下資料,由我們為你核對。";
        n.style.display = "block";
        return;
      }
      if (res.ok) {
        $("form").style.display = "none";
        $("done").style.display = "block";
        if (res.duplicate) $("doneMsg").textContent = "你的資料早前已收到,不需要重複登記。";
        return;
      }
      err.textContent = "登記未能完成,請稍後再試,或直接聯繫我們。";
      err.style.display = "block";
    })
    .catch(function () {
      btn.disabled = false;
      btn.textContent = "完成登記";
      err.textContent = "網絡出現問題,請稍後再試。";
      err.style.display = "block";
    });
  });
})();
</script>
</body>
</html>
